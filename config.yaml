# All model calls go through LiteLLM, so any provider/model string LiteLLM
# understands works here.
models:
  small: "anthropic/claude-haiku-4-5-20251001"
  large: "anthropic/claude-sonnet-4-6"

# USD per 1M tokens. Keys must match the model strings above exactly.
prices:
  "anthropic/claude-haiku-4-5-20251001": {input: 1.0, output: 5.0}
  "anthropic/claude-sonnet-4-6":         {input: 3.0, output: 15.0}

embedding_model: "sentence-transformers/all-mpnet-base-v2"

cache:
  # Set this with scripts/tune_threshold.py, not by hand.
  threshold: 0.50
  verifier: "llm:anthropic/claude-haiku-4-5-20251001"
  verify_threshold: 0.50
  ttl_seconds: 604800
  collection: "semantic_cache"

retrieval:
  collection: "documents"
  top_k: 4

escalation:
  min_top_score: 0.35        # escalate if best retrieval score is below this
  require_citation: true

paths:
  qdrant: "./.qdrant"        # local on-disk Qdrant, no server needed
  db: "./requests.db"
